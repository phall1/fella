name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux-gnu.2.28
            arch: x86_64
            runner: ubuntu-24.04
          - target: aarch64-linux-gnu.2.28
            arch: aarch64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        run: bash scripts/zig.sh version

      - name: Build release binary
        run: bash scripts/zig.sh build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSafe

      - name: Package binary
        run: |
          mkdir -p dist
          cp zig-out/bin/fella dist/fella-${{ github.ref_name }}-${{ matrix.arch }}-linux
          cp README.md LICENSE dist/
          cp contrib/apparmor/fella-bwrap dist/fella-bwrap.apparmor
          chmod +x dist/fella-${{ github.ref_name }}-${{ matrix.arch }}-linux

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fella-${{ matrix.arch }}-linux
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
